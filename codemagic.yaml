workflows:
  react-native-android:
    name: React Native Android Build
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 17
      groups:
        - OCR_MATRICULAS_SECRETS
    scripts:
      - name: Instalar dependencias
        script: |
          npx --yes pnpm@9.12.0 install --frozen-lockfile

      - name: Diagnosticar expo-asset y expo-audio
        script: |
          echo "===== npm explain expo-asset ====="
          npm explain expo-asset || true

          echo
          echo "===== npm ls relevante ====="
          npm ls expo-audio expo-asset expo-modules-core --all || true

          echo
          echo "===== package.json de paquetes relevantes ====="
          node - <<'NODE'
          const fs = require("fs");

          const paths = [
            "node_modules/expo/package.json",
            "node_modules/expo-audio/package.json",
            "node_modules/expo-asset/package.json",
            "node_modules/expo-audio/node_modules/expo-asset/package.json"
          ];

          for (const path of paths) {
            console.log("\n### " + path);

            try {
              const pkg = JSON.parse(fs.readFileSync(path, "utf8"));

              console.log(JSON.stringify({
                name: pkg.name,
                version: pkg.version,
                dependencies: pkg.dependencies,
                peerDependencies: pkg.peerDependencies,
                bundledDependencies: pkg.bundledDependencies
              }, null, 2));
            } catch (e) {
              console.log("NO EXISTE");
            }
          }
          NODE

          echo
          echo "===== TODAS LAS COPIAS DE expo-asset ====="
          find node_modules -path "*/expo-asset/package.json" -print

          echo
          echo "===== REFERENCIAS A AnyTypeCache ====="
          grep -RIl "AnyTypeCache" node_modules/expo-asset node_modules/expo-audio 2>/dev/null || true

          echo
          echo "===== AssetModule ====="
          grep -RIl "class AssetModule" node_modules/expo-asset node_modules/expo-audio 2>/dev/null || true

          echo
          echo "===== CONTENIDO DE expo-asset ====="
          find node_modules/expo-asset -maxdepth 3 -type f | sort | head -200
      - name: Diagnostico dependencias Expo
        script: |
          echo "===== VERSIONES EXPO ====="
          npm ls expo expo-modules-core expo-asset expo-router expo-camera expo-location expo-media-library --all || true

          echo
          echo "===== PACKAGE.JSON INSTALADOS ====="
          node - <<'NODE'
          const packages = [
            "expo",
            "expo-modules-core",
            "expo-asset",
            "expo-router",
            "expo-camera",
            "expo-location",
            "expo-media-library"
          ];

          for (const name of packages) {
            try {
              const pkg = require(`${name}/package.json`);
              console.log(`${name}: ${pkg.version}`);
            } catch (e) {
              console.log(`${name}: NO DISPONIBLE`);
            }
          }
          NODE
      - name: Generar proyecto Android
        script: |
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
            echo "OK: GOOGLE_MAPS_API_KEY está disponible en el entorno de build."
          else
            echo "ERROR: GOOGLE_MAPS_API_KEY NO está disponible en el entorno de build."
            exit 1
          fi

          npx expo prebuild --platform android

          echo "===== Diagnóstico seguro de GOOGLE_MAPS_API_KEY ====="
          echo "Longitud de GOOGLE_MAPS_API_KEY:"
          printf '%s' "$GOOGLE_MAPS_API_KEY" | wc -c

          echo "SHA-256 de GOOGLE_MAPS_API_KEY:"
          printf '%s' "$GOOGLE_MAPS_API_KEY" | sha256sum

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: no existe $MANIFEST"
            exit 1
          fi

          echo "SHA-256 de la API key presente en AndroidManifest:"
          python - <<'PY2'
from pathlib import Path
import re
import hashlib

manifest = Path("android/app/src/main/AndroidManifest.xml").read_text()

match = re.search(
    r'<meta-data[^>]*android:name="com\.google\.android\.geo\.API_KEY"[^>]*android:value="([^"]*)"',
    manifest,
)

if not match:
    print("ERROR: no se encontró el valor de com.google.android.geo.API_KEY")
else:
    value = match.group(1)
    print(hashlib.sha256(value.encode()).hexdigest())
    print(f"Longitud de la API key del Manifest: {len(value)}")
PY2

          echo "===== AndroidManifest: comprobación de Google Maps ====="

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: no existe $MANIFEST"
            exit 1
          fi

          if grep -q 'com.google.android.geo.API_KEY' "$MANIFEST"; then
            echo "OK: AndroidManifest contiene com.google.android.geo.API_KEY."
          else
            echo "ERROR: AndroidManifest NO contiene com.google.android.geo.API_KEY."
          fi

          if grep -q 'com.google.android.geo.API_KEY' "$MANIFEST"; then
            echo "===== Contexto de la metadata Google Maps ====="
            grep -B 2 -A 2 'com.google.android.geo.API_KEY' "$MANIFEST" | sed -E 's/(android:value=")[^"]*"/\1[OCULTO]"/g'
          fi
      - name: Comprobar bundle JavaScript
        script: |
          NODE_ENV=production npx expo export --platform android
      - name: Generar APK de Android
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk